<style>

<body>
<div id="printdoc"></div>
<div class="wrap" id="app"><div class="card none">…جارٍ تحميل بطاقة الآلية</div></div>
<script>
// رمز الآلية القصير — نسخة مطابقة تماماً لما في البرنامج، وإلا لم يتطابق أي رمز
function vehCode(v) {
  var s = String((v && (v.id || v.plate)) || "");
  var h1 = 0x811c9dc5 >>> 0, h2 = 0x1000193 >>> 0;
  for (var i = 0; i < s.length; i++) {
    var c = s.charCodeAt(i);
    h1 = (((h1 ^ c) >>> 0) * 16777619) >>> 0;
    h2 = (((h2 + c * (i + 1)) >>> 0) * 31) >>> 0;
  }
  return (h1.toString(36) + h2.toString(36)).replace(/[^a-z0-9]/g, "").slice(0, 10);
}
// ====== قناة البلاغات الميدانية ======
// RT: رمز وصول منفصل خاص بالبلاغات وحدها — ينشئه المشرف (Fine-grained PAT على
// هذا المستودع بصلاحية Contents فقط) ويلصقه بين علامتي الاقتباس ثم يرفع الملف.
// إلغاؤه من GitHub يقطع القناة فوراً دون أي أثر على البرنامج أو رموزه.
var RT = "";
var REPORTS_PATH = "reports.json";
var GH_REPORTS = "https://api.github.com/repos/alsubhi1415-dev/Akram.Su/contents/" + REPORTS_PATH;
var MAX_PENDING = 30, MAX_DESC = 300;
function b64enc(s){ return btoa(unescape(encodeURIComponent(s))); }
var LOGO = "logo.png";
// تحويل تاريخ هجري (1447/12/25) إلى رقم يوم يولياني: تقدير جدولي ثم مطابقة عكسية
// على تقويم أم القرى نفسه عبر Intl — فالنتيجة مطابقة للتقويم الرسمي لا تقريباً له
function hijriJD(s){
  var m=String(s||"").match(/(\d{3,4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(!m) return null;
  var y=+m[1], mo=+m[2], d=+m[3];
  if(y<1300||y>1600||mo<1||mo>12||d<1||d>30) return null;
  var est = d + Math.ceil(29.5*(mo-1)) + (y-1)*354 + Math.floor((3+11*y)/30) + 1948439;
  try {
    var fmt = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{day:"numeric",month:"numeric",year:"numeric"});
    for (var off=-6; off<=6; off++) {
      var jd = est + off;
      var g = jdToDate(jd);
      var p = fmt.formatToParts(g), o = {};
      p.forEach(function(x){ o[x.type]=x.value; });
      var yy = parseInt(String(o.year||"").replace(/[^0-9]/g,""),10);
      if (yy===y && parseInt(o.month,10)===mo && parseInt(o.day,10)===d) return jd;
    }
  } catch(e){}
  return est;
}
function jdToDate(jd){
  var a=jd+32044, b=Math.floor((4*a+3)/146097), c=a-Math.floor(146097*b/4);
  var dd=Math.floor((4*c+3)/1461), e=c-Math.floor(1461*dd/4), mm=Math.floor((5*e+2)/153);
  var day=e-Math.floor((153*mm+2)/5)+1, month=mm+3-12*Math.floor(mm/10), year=100*b+dd-4800+Math.floor(mm/10);
  return new Date(year, month-1, day, 12);
}
function gregJD(dt){
  var a=Math.floor((14-(dt.getMonth()+1))/12), y=dt.getFullYear()+4800-a, mo=(dt.getMonth()+1)+12*a-3;
  return dt.getDate() + Math.floor((153*mo+2)/5) + 365*y + Math.floor(y/4) - Math.floor(y/100) + Math.floor(y/400) - 32045;
}
var STOPPED=["عطلانة","تحت إجراءات الرجيع","صدر قرار الرجيع","متوقفة عن العمل"];
var WORKING=["تعمل","تم الإصلاح","تعمل بوجود ملاحظات"];
function counterHtml(v){
  var st=(v.status||"").trim(), today=gregJD(new Date()), days=null, label="", note="";
  if(STOPPED.indexOf(st)>=0){
    var f=(v.faults||[]).slice().sort(function(a,b){return String(b.date||"").localeCompare(String(a.date||""));});
    var pick=null;
    for(var i=0;i<f.length;i++){ if(!String(f[i].repairDate||"").trim()){pick=f[i];break;} }
    if(!pick&&f.length)pick=f[0];
    var jd=pick?hijriJD(pick.date):null;
    if(jd!=null){ days=Math.max(0,today-jd); label="عدد أيام توقف الآلية عن العمل"; note="محسوبة من تاريخ العطل "+esc(pick.date); }
  } else if(WORKING.indexOf(st)>=0 && v.createdAt){
    var d=new Date(String(v.createdAt).slice(0,10)+"T12:00:00");
    if(!isNaN(d)){ days=Math.max(0,today-gregJD(d)); label="عدد أيام استمرارها بالعمل بدون أعطال"; note="محسوبة من تاريخ إضافة الآلية"; }
  }
  if(days==null) return "";
  return '<div class="cnt"><div class="cn">'+days+'</div><div class="cl">'+label+'</div><div class="cm">'+note+'</div></div>';
}
var ST = {
  "تعمل": "#1B6E42", "عطلانة": "#9E1B22", "تم الإصلاح": "#1F6FB8",
  "تعمل بوجود ملاحظات": "#8A5D0B", "تحت التجهيز والتسليم": "#12796E",
  "تحت إجراءات الرجيع": "#5B4B9E", "صدر قرار الرجيع": "#5A6172"
};
function esc(s){ return String(s==null?"":s).replace(/[<>&]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c];}); }
function param(){
  var m = location.search.match(/[?&]c=([A-Za-z0-9]+)/);
  if (m) return { c: m[1] };
  m = location.search.match(/[?&]p=([^&]+)/);
  if (m) { try { return { p: decodeURIComponent(m[1]) }; } catch(e) { return { p: m[1] }; } }
  m = (location.hash||"").match(/[#&]?v=([A-Za-z0-9]+)/);
  return m ? { c: m[1] } : null;
}
function row(k,val){ return "<tr><th>"+esc(k)+"</th><td>"+(esc(val)||"—")+"</td></tr>"; }
// التاريخ الميلادي المخزن يُعرض هجرياً وميلادياً معاً (تقويم أم القرى)
function dualDate(s){
  if (!s) return "";
  var d = new Date(String(s).slice(0,10) + "T12:00:00");
  if (isNaN(d)) return String(s);
  var g = d.getFullYear() + "/" + ("0"+(d.getMonth()+1)).slice(-2) + "/" + ("0"+d.getDate()).slice(-2) + "م";
  try {
    var p = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{day:"numeric",month:"numeric",year:"numeric"}).formatToParts(d);
    var o = {}; p.forEach(function(x){ o[x.type]=x.value; });
    var y = String(o.year||"").replace(/[^0-9]/g,"");
    if (y) return y + "/" + ("0"+o.month).slice(-2) + "/" + ("0"+o.day).slice(-2) + "هـ — " + g;
  } catch(e){}
  return g;
}
// حارس الشمول: أي حقل يُستحدث بالقاعدة مستقبلاً يظهر تلقائياً بلا تعديل هذه الصفحة
var KNOWN = ["id","_ts","plate","type","status","unit","location","itemNo","chassis","model","color","notes","createdAt","faults","transfers","log","maintenance"];
function extraRows(v){
  var h = "";
  for (var k in v) {
    if (!Object.prototype.hasOwnProperty.call(v,k)) continue;
    if (KNOWN.indexOf(k) >= 0) continue;
    var val = v[k];
    if (val == null || typeof val === "object") continue;
    h += row(k, val);
  }
  return h;
}
// مستند الطباعة: جداول مصممة للورقة بكامل عرضها — لا التقاط لشاشة البطاقة
function printDoc(v, col){
  var kv = function(k1,v1,k2,v2){
    return "<tr><th>"+esc(k1)+"</th><td>"+(esc(v1)||"—")+"</td><th>"+esc(k2)+"</th><td>"+(esc(v2)||"—")+"</td></tr>";
  };
  var f=(v.faults||[]).slice().sort(function(a,b){return String(b.date||"").localeCompare(String(a.date||""));});
  var tr=v.transfers||[];
  var mt=(v.maintenance||[]).slice().sort(function(a,b){return String(b.date||"").localeCompare(String(a.date||""));});
  var lg=(v.log||[]).slice().reverse();
  // العدّاد سطراً ضمن الجدول لا بطاقة زخرفية
  var cEl=(function(){var d=document.createElement("div");d.innerHTML=counterHtml(v);return d;})();
  var cNum=(cEl.querySelector(".cn")||{}).textContent||"";
  var cLbl=(cEl.querySelector(".cl")||{}).textContent||"";
  var h='<div class="ph"><div class="pt">'
    + '<div class="p1">الإدارة العامة للدفاع المدني بمحافظة جدة</div>'
    + '<div class="p2">شعبة الاطفاء والانقاذ — سجل متابعة الآليات</div>'
    + '<div class="p3">بطاقة بيانات آلية — رقم اللوحة: '+esc(v.plate||"—")+'</div>'
    + '</div><img src="'+LOGO+'" alt=""/></div>';
  h+='<h3>أولاً — البيانات الأساسية</h3><table class="kv">'
    + kv("مسمى الآلية", v.type, "رقم اللوحة", v.plate)
    + kv("الحالة الفنية", v.status, "الموديل", v.model)
    + kv("جهة الآلية", v.unit, "الموقع الحالي", v.location)
    + kv("رقم الصنف", v.itemNo, "رقم الشاصية", v.chassis)
    + kv("اللون", v.color, "تاريخ إضافة السجل", dualDate(v.createdAt))
    + '<tr><th>ملاحظات</th><td colspan="3">'+(esc(v.notes)||"—")+'</td></tr>'
    + (cNum!=="" ? '<tr><th>'+esc(cLbl)+'</th><td colspan="3"><b>'+esc(cNum)+' يوماً</b></td></tr>' : "")
    + '</table>';
  h+='<h3>ثانياً — سجل الأعطال والإصلاحات ('+f.length+')</h3>';
  h+= f.length
    ? '<table><tr><th class="num" style="width:6%">م</th><th style="width:15%">نوع العطل</th><th style="width:13%">تاريخ العطل</th><th style="width:13%">تاريخ الإصلاح</th><th style="width:31%">الوصف</th><th style="width:22%">الجهة المتسببة</th></tr>'
      + f.map(function(x,i){return '<tr><td class="num">'+(i+1)+'</td><td>'+(esc(x.faultType)||"—")+'</td><td class="num">'+(esc(x.date)||"—")+'</td><td class="num">'+(esc(x.repairDate)||"لم يُصلح بعد")+'</td><td>'+(esc(x.desc)||"—")+'</td><td>'+(esc(x.causedBy)||"—")+'</td></tr>';}).join("")
      + '</table>'
    : '<table><tr><td>لا أعطال مسجلة لهذه الآلية</td></tr></table>';
  h+='<h3>ثالثاً — مسار التنقل بين الجهات ('+tr.length+')</h3>';
  h+= tr.length
    ? '<table><tr><th class="num" style="width:6%">م</th><th style="width:30%">من</th><th style="width:30%">إلى</th><th style="width:14%">التاريخ</th><th style="width:20%">السبب</th></tr>'
      + tr.map(function(x,i){return '<tr><td class="num">'+(i+1)+'</td><td>'+(esc(x.from)||"—")+'</td><td>'+(esc(x.to)||"—")+'</td><td class="num">'+(esc(x.date)||"—")+'</td><td>'+(esc(x.reason)||"—")+'</td></tr>';}).join("")
      + '</table>'
    : '<table><tr><td>لم تُنقل هذه الآلية بين الجهات</td></tr></table>';
  h+='<h3>رابعاً — سجل الصيانات الدورية ('+mt.length+')</h3>';
  h+= mt.length
    ? '<table><tr><th class="num" style="width:6%">م</th><th style="width:28%">نوع الصيانة</th><th style="width:16%">تاريخها</th><th style="width:50%">البيان</th></tr>'
      + mt.map(function(x,i){return '<tr><td class="num">'+(i+1)+'</td><td>'+(esc(x.type)||"صيانة دورية")+'</td><td class="num">'+(esc(x.date)||"—")+'</td><td>'+(esc(x.desc)||"—")+'</td></tr>';}).join("")
      + '</table>'
    : '<table><tr><td>لا صيانات دورية مسجلة بعد — ستُدرج فور اعتماد تسجيلها</td></tr></table>';
  h+='<h3>خامساً — أرشيف التعديلات ('+lg.length+')</h3>';
  h+= lg.length
    ? '<table><tr><th class="num" style="width:6%">م</th><th style="width:14%">التاريخ</th><th style="width:20%">الحقل</th><th style="width:30%">القيمة السابقة</th><th style="width:30%">القيمة الجديدة</th></tr>'
      + lg.map(function(x,i){return '<tr><td class="num">'+(i+1)+'</td><td class="num">'+(esc(x.at)||"—")+'</td><td>'+(esc(x.f)||"—")+'</td><td>'+(esc(x.from)||"—")+'</td><td>'+(esc(x.to)||"—")+'</td></tr>';}).join("")
      + '</table>'
    : '<table><tr><td>لم تُعدَّل بيانات هذه الآلية بعد</td></tr></table>';
  h+='<div class="pf">بطاقة عرض فقط — لا تتيح تعديل السجل · الإدارة العامة للدفاع المدني بمحافظة جدة</div>';
  return h;
}
// ====== نافذة الإبلاغ وإرساله ======
function openReport(v, kind){
  var old = document.getElementById("rep-ovl"); if (old) old.remove();
  var isF = kind === "fault";
  var ov = document.createElement("div");
  ov.id = "rep-ovl";
  ov.innerHTML = ''
    + '<div class="rp-card">'
    + '<div class="rp-t">' + (isF ? "🔧 الإبلاغ عن عطل جديد" : "✅ الإبلاغ عن إصلاح الآلية") + '</div>'
    + '<div class="rp-v">' + esc(v.plate||"") + ' — ' + esc(v.type||"") + '</div>'
    + '<div class="rp-n">إشعار أولي للمشرف فقط — لا يغيّر حالة الآلية في السجل حتى يعتمده، والطريقة المعتمدة للإبلاغ تبقى كما هي.</div>'
    + '<textarea id="rp-desc" maxlength="' + MAX_DESC + '" rows="4" placeholder="' + (isF ? "صف العطل باختصار (إلزامي)…" : "ملاحظة عن الإصلاح (اختياري)…") + '"></textarea>'
    + '<div class="rp-d">تاريخ البلاغ يُسجل تلقائياً: <b>' + esc(todayDual()) + '</b></div>'
    + '<div class="rp-btns">'
    + '<button id="rp-x" class="rp-b rp-gray">إلغاء</button>'
    + '<button id="rp-go" class="rp-b" style="background:' + (isF ? "#7E1A2F" : "#1B6E42") + '">📨 إرسال البلاغ</button>'
    + '</div>'
    + '<div id="rp-msg" class="rp-m"></div>'
    + '</div>';
  document.body.appendChild(ov);
  ov.onclick = function(e){ if (e.target === ov) ov.remove(); };
  document.getElementById("rp-x").onclick = function(){ ov.remove(); };
  document.getElementById("rp-go").onclick = function(){ sendReport(v, kind); };
}
function todayDual(){
  var d = new Date();
  var g = d.getFullYear() + "/" + ("0"+(d.getMonth()+1)).slice(-2) + "/" + ("0"+d.getDate()).slice(-2) + "م";
  try {
    var p = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{day:"numeric",month:"numeric",year:"numeric"}).formatToParts(d);
    var o = {}; p.forEach(function(x){ o[x.type]=x.value; });
    var y = String(o.year||"").replace(/[^0-9]/g,"");
    if (y) return y + "/" + ("0"+o.month).slice(-2) + "/" + ("0"+o.day).slice(-2) + "هـ — " + g;
  } catch(e){}
  return g;
}
function rpSay(msg, okState){
  var m = document.getElementById("rp-msg");
  if (m) { m.textContent = msg; m.style.color = okState ? "#1B6E42" : "#9E1B22"; }
}
function sendReport(v, kind){
  var isF = kind === "fault";
  var desc = (document.getElementById("rp-desc")||{value:""}).value.trim();
  if (isF && !desc) { rpSay("وصف العطل إلزامي", false); return; }
  if (!RT) { rpSay("قناة البلاغات لم تُفعَّل بعد — أبلغ بالطريقة المعتمدة", false); return; }
  var go = document.getElementById("rp-go");
  go.disabled = true; go.textContent = "⏳ جارٍ الإرسال…";
  var attempt = function(tries){
    // نقرأ الملف من الواجهة العامة (بلا رمز) ثم نكتب النسخة الجديدة برمز البلاغات وحده
    fetch(GH_REPORTS + "?ref=main", { headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + RT }, cache: "no-store" })
      .then(function(r){
        if (r.status === 404) return { sha: null, list: [] };
        if (!r.ok) throw new Error("net");
        return r.json().then(function(j){
          var txt = "";
          try { txt = decodeURIComponent(escape(atob(String(j.content||"").replace(/\n/g,"")))); } catch(e){}
          var list = [];
          try { list = JSON.parse(txt); } catch(e){ list = []; }
          if (!Array.isArray(list)) list = [];
          return { sha: j.sha, list: list };
        });
      })
      .then(function(st){
        if (st.list.length >= MAX_PENDING) { throw new Error("full"); }
        if (st.list.some(function(x){ return x && x.code === vehCode(v) && x.kind === kind; })) { throw new Error("dup"); }
        var ref = "B" + Date.now().toString(36).toUpperCase().slice(-6);
        st.list.push({
          id: Date.now(), ref: ref, code: vehCode(v),
          plate: v.plate || "", vtype: v.type || "", unit: v.unit || "",
          kind: kind, desc: desc.slice(0, MAX_DESC), at: todayDual(),
        });
        var body = { message: "بلاغ ميداني " + ref + " — " + (v.plate||""), content: b64enc(JSON.stringify(st.list, null, 1)), branch: "main" };
        if (st.sha) body.sha = st.sha;
        return fetch(GH_REPORTS, {
          method: "PUT",
          headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + RT, "Content-Type": "application/json" },
          body: JSON.stringify(body),
        }).then(function(r){
          if (r.status === 409 || r.status === 422) { if (tries > 0) return attempt(tries - 1); throw new Error("race"); }
          if (!r.ok) throw new Error("auth");
          var card = document.querySelector("#rep-ovl .rp-card");
          if (card) card.innerHTML = '<div class="rp-ok">✅</div>'
            + '<div class="rp-t">وصل البلاغ</div>'
            + '<div class="rp-v">رقمه المرجعي: <b>' + ref + '</b></div>'
            + '<div class="rp-n">سيراجعه المشرف ويقرر اعتماده — هذا إشعار أولي ولا يغيّر السجل بنفسه.</div>'
            + '<div class="rp-btns"><button class="rp-b rp-gray" onclick="document.getElementById(\'rep-ovl\').remove()">إغلاق</button></div>';
        });
      })
      .catch(function(e){
        go.disabled = false; go.textContent = "📨 إرسال البلاغ";
        var m = String(e && e.message || "");
        rpSay(m === "dup" ? "سبق إرسال بلاغ من هذا النوع لهذه الآلية وما زال قيد المراجعة"
          : m === "full" ? "صندوق البلاغات ممتلئ — أبلغ بالطريقة المعتمدة"
          : m === "race" ? "تزاحم على الإرسال — أعد المحاولة"
          : "تعذّر الإرسال — تحقق من الاتصال أو أبلغ بالطريقة المعتمدة", false);
      });
  };
  attempt(2);
}
function render(v){
  var col = ST[(v.status||"").trim()] || "#5A6172";
  var h = "";
  h += '<div class="hd"><div class="hdr">'
     + '<span class="lgb"><img class="logo" src="'+LOGO+'" alt="شعار الدفاع المدني"/></span>'
     + '<div class="hdt"><div class="o">الإدارة العامة للدفاع المدني بمحافظة جدة</div>'
     + '<div class="s">شعبة الاطفاء والانقاذ — سجل متابعة الآليات</div></div>'
     + '</div>'
     + '<div class="plate">'+esc(v.plate||"—")+'</div>'
     + '<div class="type">'+esc(v.type||"")+'</div>'
     + '<span class="badge" style="background:'+col+';color:#fff">'+esc(v.status||"—")+'</span>'
     + counterHtml(v) + '</div>';

  h += '<div class="card"><h2>البيانات الأساسية</h2><table>'
     + row("جهة الآلية", v.unit) + row("الموقع الحالي", v.location)
     + row("رقم الصنف", v.itemNo) + row("رقم الشاصية", v.chassis)
     + row("الموديل", v.model) + row("اللون", v.color)
     + row("ملاحظات", v.notes) + row("تاريخ إضافة السجل", dualDate(v.createdAt))
     + extraRows(v)
     + '</table></div>';

  var f = (v.faults||[]).slice().sort(function(a,b){ return String(b.date||"").localeCompare(String(a.date||"")); });
  h += '<div class="card"><h2>سجل الأعطال والإصلاحات ('+f.length+')</h2>';
  h += f.length ? f.map(function(x){
    return '<div class="lst"><div class="t">'+esc(x.faultType||"عطل")+'</div>'
      + '<div class="m">تاريخ العطل: '+(esc(x.date)||"—")+' · تاريخ الإصلاح: '+(esc(x.repairDate)||"لم يُصلح بعد")+'</div>'
      + (x.desc ? '<div class="d">'+esc(x.desc)+'</div>' : "")
      + (x.causedBy ? '<div class="m">الجهة المتسببة: '+esc(x.causedBy)+'</div>' : "")
      + '</div>';
  }).join("") : '<div class="none">لا أعطال مسجلة لهذه الآلية</div>';
  h += '</div>';

  var t = v.transfers||[];
  h += '<div class="card"><h2>مسار التنقل بين الجهات ('+t.length+')</h2>';
  h += t.length ? t.map(function(x){
    return '<div class="lst"><div class="t">'+(esc(x.from)||"—")+' ← '+(esc(x.to)||"—")+'</div>'
      + '<div class="m">'+(esc(x.date)||"—")+(x.reason?' · '+esc(x.reason):"")+'</div></div>';
  }).join("") : '<div class="none">لم تُنقل هذه الآلية بين الجهات</div>';
  h += '</div>';

  var mt = (v.maintenance||[]).slice().sort(function(a,b){return String(b.date||"").localeCompare(String(a.date||""));});
  var last = mt[0];
  h += '<div class="card mx"><h2>سجل الصيانات الدورية</h2>'
     + '<div class="mrow">'
     + '<div class="mbox"><div class="mk">آخر صيانة دورية</div><div class="mv">'+(last?esc(last.type||"صيانة دورية"):"—")+'</div></div>'
     + '<div class="mbox"><div class="mk">تاريخها</div><div class="mv">'+(last?esc(last.date||"—"):"—")+'</div></div>'
     + '<div class="mbox"><div class="mk">عدد الصيانات المسجلة</div><div class="mv">'+mt.length+'</div></div>'
     + '</div>'
     + (mt.length ? mt.map(function(x){
         return '<div class="lst"><div class="t">'+esc(x.type||"صيانة دورية")+'</div>'
           + '<div class="m">'+(esc(x.date)||"—")+(x.desc?' · '+esc(x.desc):"")+'</div></div>';
       }).join("") : '<div class="none">ستُعرض هنا بيانات الصيانة الدورية فور اعتماد تسجيلها</div>')
     + '</div>';

  var lg = (v.log||[]).slice().reverse();
  h += '<div class="card"><h2>أرشيف التعديلات ('+lg.length+')</h2>';
  h += lg.length ? lg.map(function(x){
    return '<div class="lst"><div class="t">'+esc(x.f)+' <span class="m">'+esc(x.at)+'</span></div>'
      + '<div class="d"><span class="old">'+(esc(x.from)||"—")+'</span> ← <span class="new">'+(esc(x.to)||"—")+'</span></div></div>';
  }).join("") : '<div class="none">لم تُعدَّل بيانات هذه الآلية بعد</div>';
  h += '</div>';

  var stopped = ["عطلانة","تحت إجراءات الرجيع","صدر قرار الرجيع"].indexOf((v.status||"").trim()) >= 0;
  var kind = stopped ? "repair" : "fault";
  h += '<div class="noprint" style="text-align:center;margin-bottom:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">'
     + '<button onclick="window.print()">🖨 طباعة البطاقة</button>'
     + '<button id="rep-btn" style="background:' + (stopped ? "#1B6E42" : "#7E1A2F") + '">'
     + (stopped ? "✅ الإبلاغ عن إصلاح الآلية" : "🔧 الإبلاغ عن عطل جديد") + '</button>'
     + '</div>';
  h += '<div class="ft">بطاقة عرض فقط — لا تتيح تعديل السجل<br>الإدارة العامة للدفاع المدني بمحافظة جدة · صفحة العرض v6</div>';
  document.getElementById("app").innerHTML = h;
  document.getElementById("printdoc").innerHTML = printDoc(v, col);
  document.title = "بطاقة " + (v.plate||"آلية");
  var rb = document.getElementById("rep-btn");
  if (rb) rb.onclick = function(){ openReport(v, kind); };
}
function fail(msg){
  document.getElementById("app").innerHTML =
    '<div class="hd"><div class="o">الإدارة العامة للدفاع المدني بمحافظة جدة</div>'
    + '<div class="s">شعبة الاطفاء والانقاذ — سجل متابعة الآليات</div></div>'
    + '<div class="card none">'+esc(msg)+'</div>'
    + manualEntry();
  wireManual();
}
// الإدخال اليدوي: الرمز مطبوع على كل ملصق، فكتابته هنا تفتح البطاقة
// بلا الاعتماد على تطبيق الكاميرا إن تعثّر في فتح الروابط
function manualEntry(){
  return '<div class="card">'
    + '<h2>فتح البطاقة بالرمز</h2>'
    + '<div style="font-size:12px;font-weight:700;color:var(--mut);line-height:1.9;margin-bottom:9px">اكتب رمز الآلية المطبوع على الملصق أسفل الباركود (أحرف إنجليزية وأرقام) ثم اضغط عرض.</div>'
    + '<div style="display:flex;gap:8px">'
    + '<input id="man-code" dir="ltr" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="مثال: k3f9d2ab" '
    + 'style="flex:1;border:1.5px solid #C9CDD6;border-radius:11px;padding:10px 12px;font-family:inherit;font-size:15px;font-weight:800;letter-spacing:1px;text-align:center;box-sizing:border-box">'
    + '<button id="man-go">عرض البطاقة</button>'
    + '</div><div id="man-msg" style="font-size:12px;font-weight:800;color:#9E1B22;margin-top:8px;min-height:15px"></div></div>';
}
function wireManual(){
  var go=document.getElementById("man-go"), inp=document.getElementById("man-code");
  if(!go||!inp) return;
  var submit=function(){
    var c=String(inp.value||"").trim().toLowerCase().replace(/[^a-z0-9]/g,"");
    if(!c){ document.getElementById("man-msg").textContent="اكتب الرمز أولاً"; return; }
    location.href = location.pathname + "?c=" + c;
  };
  go.onclick=submit;
  inp.addEventListener("keydown",function(e){ if(e.key==="Enter") submit(); });
  try{ inp.focus(); }catch(e){}
}
(function(){
  var q = param();
  if (!q) { fail("الرابط لا يحمل رمز آلية صالحاً"); return; }
  fetch("data.json", { cache: "no-store" })
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){
      var db = d && (d.db || d);
      var list = (db && db.vehicles) || [];
      var nz = function(s){ return String(s||"").replace(/\s+/g,""); };
      var v = null;
      for (var i=0;i<list.length;i++){
        var x = list[i];
        if (q.c && vehCode(x) === q.c) { v = x; break; }
        if (q.p && (nz(x.plate) === nz(q.p) || String(x.id) === q.p)) { v = x; break; }
      }
      if (!v) { fail("لم يُعثر على آلية بهذا الرمز — قد يكون الملصق قديماً"); return; }
      render(v);
    })
    .catch(function(){ fail("تعذّر تحميل بيانات الآليات — تحقق من الاتصال ثم أعد المحاولة"); });
})();
</script>
